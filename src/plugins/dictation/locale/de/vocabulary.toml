# Was man beim Diktieren sagt, auf Deutsch. Die Wörter werden mit Whispers
# kleingeschriebener Abschrift verglichen, häufige Verhörer gehören also dazu.

[exit]
say = "Notizen beenden"
verbs = ["beenden", "beende", "stopp", "stop", "stoppen", "schließen", "schließe", "ende", "fertig", "aus"]
nouns = ["notizen", "notiz", "diktat", "diktieren"]

[undo]
phrases = ["das streichen", "streich das", "das löschen", "rückgängig"]

[keystrokes]
prefix = ["drücke", "drück", "taste"]

[keystrokes.names]
enter = ["enter", "eingabe", "eingabetaste", "return"]
tab = ["tab", "tabulator"]
escape = ["escape", "esc"]
backspace = ["rücktaste", "backspace", "löschen", "entfernen"]
up = ["hoch", "nach oben", "rauf"]
down = ["runter", "nach unten"]
left = ["links", "nach links"]
right = ["rechts", "nach rechts"]
home = ["pos eins", "zeilenanfang", "anfang"]
end = ["zeilenende", "ende"]
"page up" = ["bild hoch", "seite hoch", "bild auf"]
"page down" = ["bild runter", "seite runter", "bild ab"]

[counts]
eins = 1
ein = 1
eine = 1
zwei = 2
drei = 3
vier = 4
"fünf" = 5
sechs = 6
sieben = 7
acht = 8
neun = 9
zehn = 10

[[replace]]
say = ["leerzeichen"]
insert = " "

[[replace]]
say = ["neuer satz", "nächster satz"]
insert = ". "

[[replace]]
say = ["neuer absatz", "nächster absatz", "absatz"]
insert = "\n\n"

[[replace]]
say = ["neue zeile", "nächste zeile", "zeilenumbruch"]
