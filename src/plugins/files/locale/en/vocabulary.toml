# What to say, in English. Phrases are matched as whole words against
# Whisper's lowercased transcript, so common mishearings belong here too.

[commands]
open = ["open", "go to", "show", "browse"]
close = ["close"]
file_manager = ["files", "file manager", "file browser"]

[folders]
documents = ["documents", "document"]
downloads = ["downloads", "download"]
pictures = ["pictures", "photos", "picture", "photo"]
music = ["music"]
videos = ["videos", "video"]
projects = ["projects", "project"]
home = ["home"]
desktop = ["desktop"]
trash = ["trash", "trash bin", "trash can", "recycle bin", "wastebasket"]
