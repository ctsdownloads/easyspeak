# What to say, in English. Phrases are matched as whole words against
# Whisper's lowercased transcript, so common mishearings belong here too.

[numbers]
zero = 0
one = 1
two = 2
three = 3
four = 4
five = 5
six = 6
seven = 7
eight = 8
nine = 9
ten = 10

[commands]
prompt = ["numbers", "scroll", "click", "open", "close", "back", "forward", "volume", "brightness", "stop"]
