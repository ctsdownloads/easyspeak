# nfpm config — French language data for EasySpeak (multilingual Whisper small
# recognition model + Piper fr_FR-siwis-medium voice). A noarch data package,
# built from the tree staged by `packaging/stage-lang.sh fr`.
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-fr.yaml -p deb
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-fr.yaml -p rpm
name: easyspeak-lang-fr
arch: all                # architecture-independent: deb "all" / rpm "noarch"
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Matt Hartley <matt@matthartley.com>
description: |
  French speech models for EasySpeak: the multilingual Whisper small recognition
  model (Systran/faster-whisper-small) and the Piper fr_FR-siwis-medium voice
  (rhasspy/piper-voices). Installed under /opt/easyspeak/models/fr; see each
  source for its model license.
vendor: EasySpeak
homepage: https://github.com/ctsdownloads/easyspeak

provides:
- easyspeak-language

contents:
- src: ./dist/stage-lang-fr/opt/easyspeak/models/fr
  dst: /opt/easyspeak/models/fr
