# nfpm config — Italian language data for EasySpeak (multilingual Whisper small
# recognition model + Piper it_IT-paola-medium voice). A noarch data package,
# built from the tree staged by `packaging/stage-lang.sh it`.
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-it.yaml -p deb
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-it.yaml -p rpm
name: easyspeak-lang-it
arch: all                # architecture-independent: deb "all" / rpm "noarch"
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Matt Hartley <matt@matthartley.com>
description: |
  Italian speech models for EasySpeak: the multilingual Whisper small recognition
  model (Systran/faster-whisper-small) and the Piper it_IT-paola-medium voice
  (rhasspy/piper-voices). Installed under /opt/easyspeak/models/it; see each
  source for its model license.
vendor: EasySpeak
homepage: https://github.com/ctsdownloads/easyspeak

provides:
- easyspeak-language

contents:
- src: ./dist/stage-lang-it/opt/easyspeak/models/it
  dst: /opt/easyspeak/models/it
