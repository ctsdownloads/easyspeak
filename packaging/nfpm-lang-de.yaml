# nfpm config — German language data for EasySpeak (multilingual Whisper small
# recognition model + Piper de_DE-thorsten-medium voice). A noarch data package,
# built from the tree staged by `packaging/stage-lang.sh de`.
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-de.yaml -p deb
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-de.yaml -p rpm
name: easyspeak-lang-de
arch: all                # architecture-independent: deb "all" / rpm "noarch"
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Matt Hartley <matt@matthartley.com>
description: |
  German speech models for EasySpeak: the multilingual Whisper small recognition
  model (Systran/faster-whisper-small) and the Piper de_DE-thorsten-medium voice
  (rhasspy/piper-voices). Installed under /opt/easyspeak/models/de; see each
  source for its model license.
vendor: EasySpeak
homepage: https://github.com/ctsdownloads/easyspeak

provides:
- easyspeak-language

contents:
- src: ./dist/stage-lang-de/opt/easyspeak/models/de
  dst: /opt/easyspeak/models/de
