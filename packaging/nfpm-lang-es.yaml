# nfpm config — Spanish language data for EasySpeak (multilingual Whisper small
# recognition model + Piper es_ES-davefx-medium voice). A noarch data package,
# built from the tree staged by `packaging/stage-lang.sh es`.
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-es.yaml -p deb
#   VERSION=1.2.3 nfpm package -f packaging/nfpm-lang-es.yaml -p rpm
name: easyspeak-lang-es
arch: all                # architecture-independent: deb "all" / rpm "noarch"
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Matt Hartley <matt@matthartley.com>
description: |
  Spanish speech models for EasySpeak: the multilingual Whisper small recognition
  model (Systran/faster-whisper-small) and the Piper es_ES-davefx-medium voice
  (rhasspy/piper-voices). Installed under /opt/easyspeak/models/es; see each
  source for its model license.
vendor: EasySpeak
homepage: https://github.com/ctsdownloads/easyspeak

provides:
- easyspeak-language

contents:
- src: ./dist/stage-lang-es/opt/easyspeak/models/es
  dst: /opt/easyspeak/models/es
