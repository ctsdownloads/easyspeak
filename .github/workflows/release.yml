name: Release

# The application and the data packs (language packs, speech model packs) all
# release through a GitHub Release (the `release: published` event); the tag
# decides what gets built. An application tag (e.g. `v1.2.3`) runs the `pypi`
# and `packages` jobs, while a `lang-<code>-<version>` tag (e.g. `lang-en-1.0.0`)
# or an `stt-<code>-<version>` tag (e.g. `stt-parakeet-1.0.0`) skips those and
# instead runs `plan-packs` and the `packs` build matrix, attaching the pack to
# the same release. A pack tag's version segment must match the pack's version
# in pins.toml.
#
# A manual run (workflow_dispatch) builds the named packs — `lang-de`,
# `stt-parakeet`, a bare `de` being a language — or every pack in pins.toml when
# none are given, and uploads them as artifacts instead of publishing a release.

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      codes:
        description: Packs to build, space-separated (lang-de, stt-parakeet, or a bare language code); empty builds all
        default: ''

jobs:
  pypi:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'lang-') && !startsWith(github.event.release.tag_name, 'stt-')
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: false
    - uses: taiki-e/install-action@just
    - run: |
        sudo apt update
        sudo apt install -y portaudio19-dev
    - name: Build the Python package
      run: just package
    - name: Verify that package version matches Git tag
      run: just ensure_version_matches ${{ github.event.release.tag_name }}
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  packages:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'lang-') && !startsWith(github.event.release.tag_name, 'stt-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload assets to the release
    steps:
    - uses: actions/checkout@v6
    - name: Build app packages
      run: |
        tag='${{ github.event.release.tag_name }}'
        bash packaging/build-in-docker.sh "${tag#v}"
    - name: Attach packages to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload '${{ github.event.release.tag_name }}' dist/*.deb dist/*.rpm --clobber

  plan-packs:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'lang-') || startsWith(github.event.release.tag_name, 'stt-')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6
    - name: Resolve the packs to build
      id: resolve
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
        INPUT_CODES: ${{ github.event.inputs.codes }}
      run: python3 packaging/plan_pack_release.py

  packs:
    needs: plan-packs
    name: ${{ matrix.kind }}-${{ matrix.code }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the packs to the pack release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-packs.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v6
    - name: Build the pack
      env:
        KIND: ${{ matrix.kind }}
        CODE: ${{ matrix.code }}
      run: bash packaging/build-packs-in-docker.sh "$KIND" "$CODE"
    - name: Attach the pack to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/*.deb dist/*.rpm --clobber
    - name: Upload build artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: pack-${{ matrix.kind }}-${{ matrix.code }}
        path: |
          dist/*.deb
          dist/*.rpm
